
name: Build Stardew Life Mod

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.9.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.1"

      - name: Build mod
        run: gradle build --no-daemon
        working-directory: StardewLife-Fabric-1.21.11-GitHub-Build/StardewLife-Fabric-1.21.11

      - name: Upload JAR files
        uses: actions/upload-artifact@v4
        with:
          name: StardewLife-Fabric-1.21.11-JAR
          path: StardewLife-Fabric-1.21.11-GitHub-Build/StardewLife-Fabric-1.21.11/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
